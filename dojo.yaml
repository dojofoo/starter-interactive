framework: Dojofoo
tags:
  - Course authoring
  - Starter
  - Tooling
homepage: https://github.com/dojofoo/starter-interactive
repository: https://github.com/dojofoo/starter-interactive

# The lesson structure stays deterministic while each authored surface is MDX.
lessons: lessons/python-uv-dojofoo.json
